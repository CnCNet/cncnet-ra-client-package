[Settings]
; If set, includes game executable in file hash check.
; This can cause problems if different versions of the game executable exist.
; Unless your mod includes the game executable in its distribution, keep this set to false.
CalculateGameExeHash=true

; List of files included in file hash check.
; Should be altered based on individual mod's file setup, but this is a good base.
; Modders should include all relevant INI files and any additional assets on this list.
[FilenameList]
0=
