tag-prefix: 'ra-'
mode: ContinuousDeployment
increment: Patch

branches:
  # An empty tag makes GitVersion fall back to the "ci" label in ContinuousDeployment mode,
  # so master builds deploy to "updates/X.Y.Z-ci" and are served on the "ci" mirror link (the Develop channel).
  master:
    regex: ^master$
    source-branches: [ 'master' ]
    tag: ''
    increment: Patch

  # The label is used verbatim as the mirror link name, so clients on the Pre-release channel
  # read from "/updates/games/ra/pre-release/".
  pre-release:
    regex: ^pre-release$
    source-branches: [ 'master' ]
    tag: pre-release
    increment: Patch

  # Any new features that should be auto versioned should be in a branch under "feature/"
  # Example: feature/port-to-xna
  # Features will inherit the increment behaviour from their source branch and receive a branch-based pre-release label.
  feature:
    regex: ^feature?[/-]
    source-branches: [ 'master', 'pre-release' ]
    tag: useBranchName
    increment: Inherit

  # Any patches should be put under the "hotfix/" branch prefix.
  # Example: hotfix/fix-crash
  # Hotfixes will increment the version by Patch and receive a branch-based pre-release label.
  hotfix:
    regex: ^hotfix?[/-]
    source-branches: [ 'master' ]
    tag: useBranchName
    increment: Patch
