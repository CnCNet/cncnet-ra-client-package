[Briefing]
1=Mission #: 01.10.01@
2=The EDF Special Weapons Research division has recently begun trialling
3=a new form of armour-piercing shells. Used in specially modified chainguns
4=that are capable of firing up to 2000 rounds per second, these new shells
5=are set to significantly alter the battlefield balance. If these chainguns
6=come into widespread use, our current tank stockpile would be worthless.
7=You are to destroy any prototypes of this weapon, along with all research
8=on this subject.@@
9=At the testing range, there are three known prototypes. I have made a
10=significant proportion of our tank cache available to you for this
11=task, but you can expect to suffer heavy losses amongst our bretheren.
