[Briefing]
1=Mission #: 01.05.00@
2=Deep within the forests of the Aquitaine Basin lies a secret military
3=research facility, where the top French scientists are engaged in the
4=creation of biological weapons. They have recently created a
5=frighteningly deadly new biological agent. Just the thing that we
6=could use. You are to sneak the spy into the biological research
7=laboratory and steal a sample of this biological agent that the Flame
8=Dancers will use on humanity.@@
9=The area around the facility is heavily patrolled, but I have found a
10=local civilian who is willing to give us information on the patrol
11=routes. Unfortunately, the directions he gave on how to find his
12=house were less than useful. Also be aware that every 10 minutes the
13=guards perform a wide sweep of the area - do not get caught!

