[Briefing]
1=Mission #: 01.04.00@
2=The very future of the EDF hangs in the balance as we speak. The
3=British Prime Minister is currently travelling around Europe in an
4=attempt to round up enough support to block the vote that would see
5=the European Defense Force dismantled. We have invested too much
6=effort in placing Flame Dancer bretheren in positions of authority
7=within the EDF to allow this to happen. We would have to start all
8=over again, but this time trying to infiltrate individual countries,
9=something that is more difficult than doing the same to a
10=multinational organisation.@@
11=To drive home how important the EDF is to Eurpoean security, you are
12=going to shoot down the Prime Minister's plane. He is about to leave
13=France for Germany, so you have only a little time to set up the
14=necessary anti-aircraft guns that will be needed to destroy his
15=heavily armoured plane. There is a small EDF outpost in the area, but
16=they should prove to be little more than an nuisance.

