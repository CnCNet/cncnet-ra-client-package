[Briefing]
1=Mission #: 01.12.00@
2=Now to Turkey. Your objective is to replace two Turkish generals
3=with Mikal and Abdul, our two faithful brothers. By having access
4=to the Turkish military, the Flame Dancers will be able to penetrate
5=further into the East without detection by the EDF.@@
6=The two generals to be replaced are currently supervising military
7=maneouvers near Van Golu, east of Ercis. You are to proceed to this
8=area and destroy any and all military forces. The two generals that
9=are your targets will be outside some radar facilities. You must leave
10=these two radar domes intact, so our replacements can radio Izmir and
11=report that Iranian forces attacked them. Once you have destroyed the
12=armed forces in the region, have our two disciples enter the radar
13=domes.

