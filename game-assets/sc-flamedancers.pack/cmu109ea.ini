[Briefing]
1=Mission #: 01.02.00@
2=Dr. Carlos Harkins, a Flame Dancer disciple, is being held by a small
3=band of Spanish terrorists. He is being held for a large ransom
4=will pay this ransom with their deaths. He is being held in
5=isolation on a fortified island. To get to this island, you will
6=need to capture the terrorists' ship yard which can then be used to
7=create the necessary transports. When Carlos is free, we will send in
8=a transport helicopter which you need to use to evacuate the good
9=Doctor (although you have to destroy all enemy structures before the
10=helicopter pilot will feel safe enough to arrive).@

