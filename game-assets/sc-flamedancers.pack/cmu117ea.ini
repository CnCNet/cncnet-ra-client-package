[Briefing]
1=Mission #: 01.08.00@
2=The Flame Dancers are going into the business of designing weapons.
3=You are to establish Phoenix Designs, but will not have to start from
4=the very beginning. I have been made aware that a Norwegian general
5=has set up a private research base in a hidden valley to the north of
6=Glittertind. He is engaged in selling chemical weapons to various
7=third-world countries, and the highly illegal nature of this
8=operation means that he will not be able to ask the Norwegian
9=goverment for help.@@
10=You can destroy any defensive structures you find, but must leave all
11=the research buildings intact. Just in case the General suddenly
12=develops a conscience, kill him as well.@
13=The location of the research base makes it nearly impossible to bring
14=in vehicles. You will have to rely on our bretherens' skills to
15=gain control of the base.

