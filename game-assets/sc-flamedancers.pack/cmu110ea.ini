[Briefing]
1=Mission #: 01.03.01@
2=Two Flame Dancers have been attempting to establish their own power
3=base within this organisation. I WILL NOT HAVE THIS!! You are to set
4=an example with these two false friends, and exterminate them with
5=extreme prejudice. Leave the world no trace that these traitors ever
6=existed.@ First you must travel to Bulgaria and kill Renee Maraguitz.
7=She has hired a small band of mercenaries in a vain attempt to
8=protect herself from my wrath.
