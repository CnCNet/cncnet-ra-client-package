[Briefing]
1=Mission #: 01.09.01@
2=As the first stage in the construction of our air fleet,
3=we need to create a diversion that will draw the EDF's
4=Polish airforce away from our real target. To do that, you
5=are to establish what will look like a Soviet base, planting
6=the fear in the mind of the local commander that a new Soviet
7=invasion is about to begin.@
8=First, you must get our spy into this Romanian listening
9=station. Using fake buildings, you will then establish a base
10=that the spy will transmit pictures of, creating a false alert.
11=To make this realistic, your base should include: a fake
12=construction yard, a fake war factory, a fake radar dome
13=and a fake sub pen.
