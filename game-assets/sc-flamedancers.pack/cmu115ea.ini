[Briefing]
1=Mission #: 01.07.01@
2=Damn! Apparently the French researchers from whom we stole the
3=biological agent had an antidote ready just in case an accident
4=occured. What we did was no accident, but the French have braved
5=international anger at the development of such a weapon and have
6=supplied the Saudi authorities with this antidote. We had expected
7=the complete destruction of the Saudi population, but with this
8=antidote our efforts are being reduced to a paltry few thousand
9=deaths.@@
10=A halt must be put to these cures. The hospitals dispensing the cures
11=have been set up near the water processing plants, so you are to take
12=your forces and destroy not only the hospitals, but any doctors you
13=find in the area. However, do not destroy the water processing plant
14=as they are still efficiently spreading the biological agent.
