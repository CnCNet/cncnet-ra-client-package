[Briefing]
1=Mission #: 01.13.00@
2=A Defense Force cleanup squad has recently found a partially destroyed
3=research center. In this facility, the troops found a weapon that had
4=never been used in war: a thermonuclear bomb.@@
5=What we are going to do, my friend, is cause a bit of chaos. We are going
6=to detonate that bomb. The bomb is currently being transported across
7=Europe in a heavily armed convoy. When you destroy the truck carrying
8=the thermonuclear device, the bomb will explode
9=Russian engineers didn't overexert themselves whilst installing the
10=safety features.@@
11=Naturally, I don't want you anywhere near this bomb when it
12=explodes, so I have arranged for a radar dome in the area to come under
13=our control for a short period. Using this, you will be able to keep
14=in touch with our troops. All are volunteers, and know that they will
15=not return. Take them into the fire, my son. Let us be proud of their
16=faith.

